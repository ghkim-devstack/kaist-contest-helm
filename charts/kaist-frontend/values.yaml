# kaist-ai-platform/charts/kaist-frontend/values.yaml

replicaCount: 1

image:
  repository: kaist-frontend
  tag: "1.4.1"
  pullPolicy: Never

service:
  type: NodePort
  port: 8001
  nodePort: 31634

env:
  VITE_APP_APISERVER: http://kasiai.kaist.ac.kr
  VITE_JUPYTERHUB_URL: http://kasiaijupyter.kaist.ac.kr

ingress:
  enabled: true
  hosts:
    - host: kasiai.kaist.ac.kr
      paths:
        - path: /
          pathType: Prefix

resources: {}

